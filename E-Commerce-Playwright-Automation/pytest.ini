[pytest]
minversion = 8.0
pythonpath = .
addopts = 
    -ra 
    -v 
    --html=reports/report.html 
    --self-contained-html
    --capture=tee-sys
testpaths = 
    tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    smoke: Quick critical path tests
    regression: Full regression test suite
    login: Authentication related tests
    cart: Shopping cart test suite
    checkout: Checkout workflow tests
    products: Product catalog and sorting tests
